# ---------------------------------------------------------------------------
# Approved DSB partner YouTube channels.
#
# Adding a partner is one entry here plus a deploy -- never a code change.
# Their first poll records a starting point and announces nothing; every
# long-form video they publish after that lands in #content-corner.
#
# To stop monitoring a partner, delete their entry. There is no `enabled`
# flag: a source is either configured or it isn't. Adding one back later is
# a fresh onboarding, and nothing published in between is announced.
# ---------------------------------------------------------------------------

# Operational settings (enabled, poll_interval_minutes, exclude_shorts,
# discord_channel_id and discord_notify_role_id) are supplied by Terraform
# through environment variables, which take precedence over this file. They
# are intentionally not set here so there is a single source of truth. This
# file configures only the partner roster and the announcement channel name.
youtube:
  # Every announcement goes to this channel. Its numeric id comes from the
  # HERALD_DISCORD_CHANNEL_ID environment variable, set by Terraform.
  discord_channel_name: content-corner

  youtube_sources:
    - name: TechTual Talk
      relationship: COMMUNITY_PARTNER
      channel: "@TechTualChatter"
      categories:
        - cyber-security
        - tech-news
    - name: TechTual Talk Podcast
      relationship: COMMUNITY_PARTNER
      channel: "@TheTechTualTalkpod"
      categories:
        - cyber-security
        - tech-news
    - name: Techpreneurship Academy
      relationship: COMMUNITY_PARTNER
      channel: "@TechpreneurshipAcademy"
      categories:
        - tech-news
    - name: STEM With Ashley
      relationship: COMMUNITY_PARTNER
      channel: "@STEMWithAshley"
      categories:
        - tech-news
    - name: GRC Engineering Club
      relationship: COMMUNITY_PARTNER
      channel: "@grcengineeringclub"
      categories:
        - tech-news
        - cyber-security
        - grc-engineering
        - security-engineering
